<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PerformIQ AI — Track and manage student attendance, marks, and study hours in one place." />
  <title>PerformIQ AI — Student Performance Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">📊</span>
        <h1>PerformIQ AI</h1>
      </div>
      <p class="tagline">Student Performance Analytics Platform</p>
    </div>
  </header>

  <main class="main-grid">

    <!-- ── Left column: Form ───────────────────────────────────────────── -->
    <section class="card" id="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Add Student</h2>

      <form id="student-form" novalidate>

        <div class="field-group">
          <label for="input-name">Full Name</label>
          <input
            type="text"
            id="input-name"
            name="name"
            placeholder="e.g. Aarav Sharma"
            autocomplete="off"
          />
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="input-attendance">Attendance (0–100 %)</label>
            <input type="number" id="input-attendance" name="attendance" min="0" max="100" placeholder="0 – 100" />
          </div>
          <div class="field-group">
            <label for="input-study">Study Hours/week (0–40)</label>
            <input type="number" id="input-study" name="studyHours" min="0" max="40" placeholder="0 – 40" />
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="input-internal">Internal Marks (0–30)</label>
            <input type="number" id="input-internal" name="internalMarks" min="0" max="30" placeholder="0 – 30" />
          </div>
          <div class="field-group">
            <label for="input-assignment">Assignment Marks (0–20)</label>
            <input type="number" id="input-assignment" name="assignmentMarks" min="0" max="20" placeholder="0 – 20" />
          </div>
        </div>

        <!-- Inline validation errors appear here -->
        <div id="form-errors" class="error-box" hidden aria-live="polite"></div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add Student</button>
          <button type="button" id="cancel-btn" class="btn btn-ghost" hidden>Cancel Edit</button>
        </div>

      </form>
    </section>

    <!-- ── Right column: Table + Detail ────────────────────────────────── -->
    <div class="right-col">

      <!-- Student table -->
      <section class="card" id="students-section" aria-labelledby="table-heading">
        <div class="section-header">
          <h2 id="table-heading">All Students</h2>
          <span id="student-count" class="badge">0 students</span>
        </div>

        <!-- Loading indicator -->
        <div id="loading-state" class="status-msg" hidden>
          <span class="spinner" aria-hidden="true"></span> Loading students…
        </div>

        <!-- Fetch/server error -->
        <div id="fetch-error" class="error-box" hidden aria-live="polite"></div>

        <!-- Empty state -->
        <div id="empty-state" class="status-msg empty-state" hidden>
          No students yet. Add one using the form.
        </div>

        <div id="table-wrapper" hidden>
          <table id="students-table" aria-label="Student records">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Attendance</th>
                <th>Internal</th>
                <th>Assignment</th>
                <th>Study h/w</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="students-body">
              <!-- Rows inserted by script.js -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Student detail panel (hidden until "View" is clicked) -->
      <section class="card" id="detail-panel" hidden aria-labelledby="detail-heading">
        <div class="section-header">
          <h2 id="detail-heading">Student Details</h2>
          <button id="close-detail-btn" class="btn btn-ghost btn-sm" aria-label="Close detail panel">✕ Close</button>
        </div>
        <dl id="detail-content" class="detail-grid">
          <!-- Filled by script.js -->
        </dl>
      </section>

    </div><!-- /.right-col -->
  </main>

  <!-- script.js is loaded with defer: it runs after the HTML is fully parsed -->
  <script src="/script.js" defer></script>
</body>
</html>
